    url: https://store.itikia.co.ke/#contact
    about: "Email samora@itikia.co.ke with your order reference (dsh_…) and the entity the licence should name. It is reissued the same day."
  - name: "Security issue or a leaked credential (please do not post publicly)"
    url: https://store.itikia.co.ke/#contact
    about: "Email samora@itikia.co.ke with subject \"Security\" instead of opening an issue, so it is not public while it is unfixed."
