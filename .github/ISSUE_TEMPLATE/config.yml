# The "New issue" page is the first thing a non-developer meets here, and a blank
# editor is a wall. Every entry below is a route AWAY from GitHub for people who
# do not live in it.
blank_issues_enabled: true
contact_links:
  - name: "Not a developer? Email Samora — every route reaches a human"
    url: https://store.itikia.co.ke/#contact
    about: "Licence questions, invoices, procurement forms, or \"is this the right tool for us?\". Write to samora@itikia.co.ke — answered within one business day, and a call is fine if you'd rather talk."
