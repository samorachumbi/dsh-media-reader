name: Feature request
description: Suggest a capability or a change in behaviour.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Telling me what you need is the useful part — the wording is not.** If a form feels like a barrier,
        email [samora@itikia.co.ke](mailto:samora@itikia.co.ke) in whatever words are natural to you.
  - type: textarea
    id: problem
    attributes:
      label: What are you actually trying to get done?
      description: The task, not the tool — "I need the shot changes from a 40-minute webinar" beats "add a flag".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: Which tool, how long it takes, and what breaks. This is what decides whether it gets built.
  - type: input
    id: who
    attributes:
      label: Who else has this problem?
      description: One sentence is fine — a team, a workflow, a client type.
